name: Validación

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias del archivo de bloqueo
        run: npm ci --ignore-scripts
      - name: Comprobar tipos, construir y ejecutar pruebas
        run: npm run verify
      - name: Revisar avisos de dependencias
        if: matrix.node == 24
        run: npm audit --audit-level=moderate

  installer:
    name: Construir instalador Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias del archivo de bloqueo
        run: npm ci
      - name: Construir instalador local
        run: npm run installer:win
      - name: Comprobar instalador y mostrar SHA-256
        shell: pwsh
        run: |
          $installer = "dist/Lyrics-Setup-$((Get-Content package.json | ConvertFrom-Json).version)-x64.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "No se generó el instalador" }
          Get-FileHash -LiteralPath $installer -Algorithm SHA256 | Format-List
