<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'; frame-src 'none'" />
    <link rel="stylesheet" href="styles.css" />
    <title></title>
  </head>
  <body>
    <main id="overlay">
      <header id="drag-region">
        <div>
          <strong id="title">Lyrics</strong
          ><span id="artist">Esperando YouTube Music</span>
        </div>
        <button id="hide" aria-label="Ocultar">×</button>
      </header>
      <section id="lyrics" aria-live="polite">Esperando YouTube Music…</section>
      <footer>
        <label class="slider-control">Ventana<input id="window-opacity" type="range" min="0" max="100" value="92" aria-label="Opacidad de la ventana" /></label>
        <label class="slider-control">Letras<input id="lyrics-opacity" type="range" min="15" max="100" value="100" aria-label="Opacidad de las letras" /></label>
        <label class="slider-control size-control"><span>Tamaño <output id="font-size-value">27 px</output></span><input id="font-size" type="range" min="16" max="48" value="27" aria-label="Tamaño de la letra" /></label>
      </footer>
      <div class="resize-grip left" aria-label="Redimensionar desde la izquierda"></div>
      <div class="resize-grip right" aria-label="Redimensionar desde la derecha"></div>
    </main>
    <script src="preferences.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
